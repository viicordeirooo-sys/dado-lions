<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lançar o Dado — Gesto</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body {
    height:100%; width:100%;
    background:#050308;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow:hidden;
    color:#fff;
  }
  .app { position:relative; height:100vh; height:100dvh; width:100vw; }

  .cam-wrap {
    position:absolute; inset:0;
    overflow:hidden;
    transform: scaleX(-1); /* espelha câmera + overlay juntos, feito espelho */
  }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .dim { position:absolute; inset:0; background: radial-gradient(ellipse at 50% 60%, rgba(10,6,18,0.1) 0%, rgba(5,3,8,0.6) 100%); }

  .overlay { position:absolute; inset:0; pointer-events:none; }

  /* luz ambiente discreta no chão, decorativa, não revela a mecânica */
  .floor-glow {
    position:absolute; width:34vh; height:10vh; border-radius:50%;
    background: radial-gradient(ellipse, rgba(255,215,106,0.16) 0%, transparent 70%);
    transform: translate(-50%,-50%);
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%,100%{ opacity:0.55; } 50%{ opacity:1; } }

  .contact-shadow {
    position:absolute; width:20vh; height:4.5vh; border-radius:50%;
    background: rgba(0,0,0,0.55); filter: blur(1vh);
    transform: translate(-50%,-50%);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }

  .dice-scene { position:absolute; width:22vh; height:22vh; perspective:150vh; transform: translate(-50%,-50%); }
  .cube {
    width:22vh; height:22vh; position:relative;
    transform-style: preserve-3d;
    transform: rotateX(-15deg) rotateY(20deg);
    animation: idleBob 2.8s ease-in-out infinite;
  }
  @keyframes idleBob {
    0%,100% { transform: rotateX(-15deg) rotateY(20deg) translateY(0); }
    50% { transform: rotateX(-19deg) rotateY(27deg) translateY(-1vh); }
  }
  .face {
    position:absolute; width:22vh; height:22vh;
    background: linear-gradient(155deg, #2a1f10 0%, #120c05 55%, #060402 100%);
    border: 0.15vh solid rgba(255,215,106,0.4);
    border-radius:2.8vh;
    box-shadow: inset 0 0 3vh rgba(0,0,0,0.6), inset 0 0.2vh 0.7vh rgba(255,233,168,0.18);
    display:grid; grid-template-columns: repeat(3,1fr); grid-template-rows: repeat(3,1fr);
    padding: 2.8vh;
  }
  .dot {
    width:2.7vh; height:2.7vh; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff4cf, #d4af37 60%, #8a6a1a);
    box-shadow: 0 0 1.2vh rgba(255,215,106,0.6);
    align-self:center; justify-self:center;
  }
  .f-front  { transform: translateZ(11vh); }
  .f-back   { transform: rotateY(180deg) translateZ(11vh); }
  .f-right  { transform: rotateY(90deg) translateZ(11vh); }
  .f-left   { transform: rotateY(-90deg) translateZ(11vh); }
  .f-top    { transform: rotateX(90deg) translateZ(11vh); }
  .f-bottom { transform: rotateX(-90deg) translateZ(11vh); }
  .ghost { position:absolute; inset:0; opacity:0.16; filter: blur(0.5vh); pointer-events:none; }

  .hud {
    position:absolute; left:0; right:0; top:0;
    display:flex; flex-direction:column; align-items:center;
    padding: 4vh 4vw 0;
    pointer-events:none;
  }
  .title .kicker { color:#c9a6ff; font-size:1.6vh; letter-spacing:0.6vh; font-weight:600; text-transform:uppercase; opacity:0.85; text-align:center; }
  .title h1 {
    font-size:4.4vh; font-weight:800; letter-spacing:0.2vh; margin-top:0.4vh; text-align:center;
    background: linear-gradient(135deg, #fff4cf 0%, #ffd76a 35%, #d4af37 60%, #ffe9a8 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter: drop-shadow(0 2px 16px rgba(212,175,55,0.45));
  }
  .status {
    margin-top: 1.6vh;
    font-size: 2vh; letter-spacing:0.3vh; font-weight:600;
    color: rgba(255,233,168,0.85);
    text-shadow: 0 0 1.4vh rgba(0,0,0,0.7);
    text-align:center;
    min-height:2.6vh;
  }

  .bottom-hud {
    position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center;
    padding: 0 4vw 4vh;
    pointer-events:none;
  }
  .prize-banner {
    width:88vw; max-width:640px;
    padding: 2vh 2.4vh; border-radius: 2.2vh;
    display:flex; align-items:center; gap:1.8vh;
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(120,50,200,0.16));
    border: 0.25vh solid rgba(212,175,55,0.5);
    backdrop-filter: blur(6px);
    opacity:0; transform: translateY(1.6vh) scale(0.96);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.2,1.4,.4,1);
  }
  .prize-banner.show { opacity:1; transform: translateY(0) scale(1); }
  .prize-banner .icon { font-size:4.6vh; filter: drop-shadow(0 0 1.6vh currentColor); }
  .prize-banner .txt .l1 { font-size:1.5vh; letter-spacing:0.4vh; color: rgba(255,255,255,0.6); text-transform:uppercase; }
  .prize-banner .txt .l2 { font-size:2.6vh; font-weight:800; margin-top:0.3vh; }

  .permission-screen {
    position:absolute; inset:0; z-index:20;
    background: radial-gradient(ellipse at center, #1a0f2e 0%, #050308 80%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2vh; padding: 6vw; text-align:center;
  }
  .permission-screen h2 {
    font-size:2.6vh;
    background: linear-gradient(135deg, #ffd76a, #d4af37);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .permission-screen p { font-size:1.7vh; color: rgba(255,255,255,0.6); max-width:80vw; line-height:1.5; }
  .permission-btn {
    margin-top:1vh; padding: 1.6vh 4vh; border-radius:999px; border:none;
    background: linear-gradient(135deg, #d4af37, #b8860b); color:#1a0f0a;
    font-weight:700; font-size:1.8vh; letter-spacing:0.3vh; text-transform:uppercase;
  }
  .error-text { color:#f87171; font-size:1.6vh; margin-top:1vh; }

  .confetti { position:fixed; inset:0; pointer-events:none; z-index:30; }
  .confetti span { position:absolute; top:-10px; border-radius:2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity:0.2; } }

  /* ---------- TELA DE PRÊMIO ---------- */
  .prize-screen {
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 45%, rgba(36,19,56,0.75) 0%, rgba(3,2,4,0.94) 75%);
    opacity:0; pointer-events:none;
    transition: opacity 0.35s ease;
    overflow:hidden;
  }
  .prize-screen.show { opacity:1; }

  .rays {
    position:absolute; left:50%; top:50%; width:180vh; height:180vh;
    transform: translate(-50%,-50%);
    background: conic-gradient(from 0deg,
      rgba(255,215,106,0.16) 0deg, transparent 10deg,
      transparent 20deg, rgba(255,215,106,0.10) 30deg,
      transparent 40deg, transparent 50deg,
      rgba(255,215,106,0.16) 60deg, transparent 70deg,
      transparent 80deg, rgba(255,215,106,0.10) 90deg,
      transparent 100deg, transparent 110deg,
      rgba(255,215,106,0.16) 120deg, transparent 130deg,
      transparent 140deg, rgba(255,215,106,0.10) 150deg,
      transparent 160deg, transparent 170deg,
      rgba(255,215,106,0.16) 180deg, transparent 190deg,
      transparent 200deg, rgba(255,215,106,0.10) 210deg,
      transparent 220deg, transparent 230deg,
      rgba(255,215,106,0.16) 240deg, transparent 250deg,
      transparent 260deg, rgba(255,215,106,0.10) 270deg,
      transparent 280deg, transparent 290deg,
      rgba(255,215,106,0.16) 300deg, transparent 310deg,
      transparent 320deg, rgba(255,215,106,0.10) 330deg,
      transparent 340deg, transparent 350deg, rgba(255,215,106,0.16) 360deg);
    animation: raysSpin 14s linear infinite;
  }
  @keyframes raysSpin { to { transform: translate(-50%,-50%) rotate(360deg); } }

  .prize-content { position:relative; display:flex; flex-direction:column; align-items:center; gap:1.4vh; }

  .win-title {
    font-size: 3vh; font-weight:800; letter-spacing:0.8vh;
    color: transparent;
    background: linear-gradient(135deg, #fff4cf, #ffd76a 40%, #d4af37 70%, #fff4cf);
    background-size: 200% auto;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation: shimmer 2.4s linear infinite, titleDrop 0.5s cubic-bezier(.2,1.4,.4,1);
    text-shadow: 0 0 3vh rgba(255,215,106,0.4);
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  @keyframes titleDrop { 0%{ opacity:0; transform: translateY(-1.4vh); } 100%{ opacity:1; transform: translateY(0); } }

  .prize-icon-big {
    font-size: 16vh; line-height:1;
    filter: drop-shadow(0 0 4vh currentColor);
    animation: iconPop 0.6s cubic-bezier(.2,1.7,.3,1), iconFloat 2.4s ease-in-out 0.6s infinite;
  }
  @keyframes iconPop { 0%{ transform: scale(0) rotate(-25deg); opacity:0; } 70%{ transform: scale(1.15) rotate(6deg); opacity:1; } 100%{ transform: scale(1) rotate(0deg); } }
  @keyframes iconFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-1.6vh); } }

  .prize-label-big {
    font-size: 5.4vh; font-weight:800; letter-spacing:0.2vh; text-align:center;
    text-shadow: 0 0 3vh currentColor;
    animation: titleDrop 0.6s cubic-bezier(.2,1.4,.4,1) 0.15s backwards;
  }

  .prize-sub {
    font-size: 1.8vh; color: rgba(255,255,255,0.5); letter-spacing:0.3vh;
    animation: titleDrop 0.6s cubic-bezier(.2,1.4,.4,1) 0.25s backwards;
  }

  .countdown-bar {
    position:absolute; left:8vw; right:8vw; bottom:4vh;
    height:0.5vh; border-radius:1vh;
    background: rgba(255,255,255,0.12);
    overflow:hidden;
  }
  .countdown-fill {
    height:100%; width:100%;
    background: linear-gradient(90deg, #ffd76a, #d4af37);
    transform-origin: left;
  }

  .coin {
    position:absolute; top:-6vh; font-size: 3vh;
    filter: drop-shadow(0 0 1vh rgba(255,215,106,0.6));
    animation: coinFall linear forwards;
  }
  @keyframes coinFall {
    to { transform: translateY(120vh) rotate(720deg); opacity:0.15; }
  }

  .debug-panel {
    position:fixed; left:1vh; bottom:1vh; z-index:99;
    background: rgba(0,0,0,0.75); border:1px solid rgba(255,215,106,0.4);
    border-radius:1vh; padding:1.2vh 1.6vh;
    font-family: monospace; font-size:1.5vh; line-height:1.7;
    color:#9fffb0; white-space:pre; pointer-events:none;
    max-width:44vh;
  }
</style>
</head>
<body>

<div class="app">
  <div class="cam-wrap" id="camWrap">
    <video id="video" playsinline muted></video>
    <div class="dim"></div>
    <div class="overlay" id="overlay">
      <div class="floor-glow" id="floorGlow"></div>
      <div class="contact-shadow" id="contactShadow"></div>
      <div class="dice-scene" id="diceScene">
        <div class="cube" id="cube">
          <div class="face f-front" data-v="1"></div>
          <div class="face f-back" data-v="6"></div>
          <div class="face f-right" data-v="2"></div>
          <div class="face f-left" data-v="5"></div>
          <div class="face f-top" data-v="3"></div>
          <div class="face f-bottom" data-v="4"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hud">
    <div class="title">
      <div class="kicker">Lions · Sorte Premiada</div>
      <h1>PEGUE E LANCE O DADO</h1>
    </div>
    <div class="status" id="status">Agache e pegue o dado com as duas mãos</div>
  </div>

  <div class="bottom-hud">
    <div class="prize-banner" id="prizeBanner">
      <div class="icon" id="prizeIcon">🎰</div>
      <div class="txt"><div class="l1">Você ganhou</div><div class="l2" id="prizeLabel">—</div></div>
    </div>
  </div>

  <div class="permission-screen" id="permScreen">
    <h2>Libere a câmera</h2>
    <p>Esse jogo lê o movimento das suas mãos pela webcam. Nada de vídeo é enviado — tudo roda no seu navegador.</p>
    <button class="permission-btn" id="permBtn">Ativar câmera</button>
    <div class="error-text" id="errText"></div>
  </div>

  <div class="prize-screen" id="prizeScreen">
    <div class="rays"></div>
    <div class="prize-content">
      <div class="win-title">VOCÊ GANHOU</div>
      <div class="prize-icon-big" id="prizeIconBig">🎰</div>
      <div class="prize-label-big" id="prizeLabelBig">—</div>
      <div class="prize-sub" id="prizeSub">Face —</div>
    </div>
    <div class="countdown-bar"><div class="countdown-fill" id="countdownFill"></div></div>
  </div>

  <div class="debug-panel" id="debugPanel" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    const tips=[4,8,12,16,20];

    tips.forEach(i=> sum += Math.hypot(lm[i].x-wrist.x, lm[i].y-wrist.y));

    const palmsRaw = hands.map(lm => ({
      x:(lm[0].x+lm[5].x+lm[9].x+lm[13].x+lm[17].x)/5,
      y:(lm[0].y+lm[5].y+lm[9].y+lm[13].y+lm[17].y)/5,
    }));
    const palms = palmsRaw.map(toPixels);

    let avg = { x:0, y:0 };
    palms.forEach(p=>{ avg.x+=p.x; avg.y+=p.y; });
    avg.x/=palms.length; avg.y/=palms.length;
    const p = avg;

    const now = performance.now();

    // casa cada mão detectada com a mesma "mão" do frame anterior (por proximidade),
    // pra medir a velocidade real de CADA mão em vez de uma média que mascara ruído
    let bothMovingUp = false;
    let bothMovingDown = false;
    if(palms.length===2){
      let ordered = palms;
      if(prevPalmsTracked && prevPalmsTracked.length===2){
        const costSame = dist(palms[0],prevPalmsTracked[0]) + dist(palms[1],prevPalmsTracked[1]);
        const costSwap = dist(palms[0],prevPalmsTracked[1]) + dist(palms[1],prevPalmsTracked[0]);
        // só troca se for CLARAMENTE melhor (histerese) — evita ficar trocando identidade
        // das mãos em frames ambíguos, o que gerava picos falsos de velocidade
        if(costSwap < costSame*0.6) ordered = [palms[1], palms[0]];

        const dt = Math.max((now-prevT)/1000, 0.001);
        const teleportLimit = camWrap.clientHeight*0.13; // deslocamento maior que isso num frame só = leitura ruim, ignora
        for(let i=0;i<2;i++){
          const d = dist(ordered[i], prevPalmsTracked[i]);
          if(d < teleportLimit){
            const vyRaw = (ordered[i].y - prevPalmsTracked[i].y)/dt;
            smoothVy[i] = smoothVy[i]*0.55 + vyRaw*0.45; // suaviza — filtra tremedeira de 1 frame
          } else {
            smoothVy[i] *= 0.5; // leitura suspeita: decai em vez de confiar nela
          }
        }
        bothMovingUp = smoothVy[0] < -camWrap.clientHeight*SMOOTH_VY_FACTOR && smoothVy[1] < -camWrap.clientHeight*SMOOTH_VY_FACTOR;
        bothMovingDown = smoothVy[0] > camWrap.clientHeight*SMOOTH_VY_FACTOR && smoothVy[1] > camWrap.clientHeight*SMOOTH_VY_FACTOR;
      }
      prevPalmsTracked = ordered;
    } else {
      prevPalmsTracked = null; smoothVy=[0,0];
    }

    if(prevT!==null){
      const dt = Math.max((now-prevT)/1000, 0.001);
      vx = (p.x-prevX)/dt;
      vy = (p.y-prevY)/dt;
    }
    prevX=p.x; prevY=p.y; prevT=now;

    if(DEBUG){
      const h = camWrap.clientHeight;
      debugPanel.textContent =
        `mode: ${mode}\n`+
        `mãos detectadas: ${palms.length}\n`+
        `smoothVy: [${smoothVy[0].toFixed(0)}, ${smoothVy[1].toFixed(0)}] px/s\n`+
        `limiar subir/descer: ±${(h*SMOOTH_VY_FACTOR).toFixed(0)} px/s\n`+
        `bothMovingUp: ${bothMovingUp}  bothMovingDown: ${bothMovingDown}\n`+
        `heldSince: ${heldSince?((now-heldSince).toFixed(0)+'ms'):'-'}  (min ${MIN_HOLD_MS}ms)\n`+
        `upStreak: ${upStreakStart?((now-upStreakStart).toFixed(0)+'ms'):'-'}  (min ${UP_SUSTAIN_MS}ms)\n`+
        `distância mãos↔dado: ${mode==='held'?dist(p,{x:dx,y:dy}).toFixed(0):'-'}px  (solta > ${(h*HOLD_RADIUS_FACTOR).toFixed(0)}px)`;
    }

    if(mode==='idle'){
      if(hasTwo){
        const dicePos = {x:restX,y:restY};
        // cada mão precisa estar perto do dado, e as duas mãos precisam estar próximas entre si
        const eachNear = palms.every(hp => dist(hp, dicePos) < camWrap.clientHeight*GRAB_RADIUS_FACTOR);
        const together = dist(palms[0], palms[1]) < camWrap.clientHeight*HANDS_TOGETHER_FACTOR;

        if(eachNear && together){
          if(nearSince===null) nearSince = now;
          if(now - nearSince >= GRAB_SUSTAIN_MS){
            mode = 'held';
            heldSince = now;
            // nasce já na posição real da mão — sem "esticar" suavemente até lá (evita o pulo)
            dx = p.x; dy = p.y;
            targetX = p.x; targetY = p.y;
            cubeRotX = -15; cubeRotY = 20;
            targetRotX = -15; targetRotY = 20;
            cube.style.animation = 'none';
            cube.style.transform = `rotateX(${cubeRotX}deg) rotateY(${cubeRotY}deg)`;
            statusEl.textContent = 'Segurou! Mexe a mão pra girar, levanta pra jogar';
            nearSince = null;
            upStreakStart = null; upStreakStartDy = null;
            smoothVy = [0,0];
            pendingThrow = false;
          }
        } else {
          nearSince = null;
        }
      } else {
        nearSince = null;
      }
    } else if(mode==='held'){
      // só atualiza os ALVOS aqui — quem renderiza (60fps, interpolado) é o loop rAF
      const dxDelta = p.x - targetX, dyDelta = p.y - targetY;
      targetX = p.x; targetY = p.y;
      targetRotY += dxDelta*0.35;
      targetRotX = Math.max(-70, Math.min(20, targetRotX - dyDelta*0.25));
      contactShadow.style.opacity = Math.max(0.15, 1 - Math.abs(targetY-restY)/(camWrap.clientHeight*0.5));

      // gatilho com sentido: as DUAS mãos precisam estar subindo JUNTAS (movimento real,
      // suavizado por mão) de forma contínua por um tempinho, cobrindo distância mínima real.
      // a contagem só COMEÇA depois da janela mínima de segurar — nada do gesto de pegar
      // (que naturalmente tem um pouco de movimento residual) pode contar como arremesso
      const heldLongEnough = heldSince && (now - heldSince) > MIN_HOLD_MS;

      if(heldLongEnough && bothMovingUp){
        if(upStreakStart===null){ upStreakStart = now; upStreakStartDy = p.y; }
        lastUpMotionT = now;
      } else if(!heldLongEnough){
        upStreakStart = null; upStreakStartDy = null; // ainda na janela de proteção: nunca acumula
      } else {
        upStreakStart = null; upStreakStartDy = null;
      }
      const streakSustained = upStreakStart!==null && (now-upStreakStart) >= UP_SUSTAIN_MS;
      const streakLifted = upStreakStart!==null && (upStreakStartDy - p.y) > camWrap.clientHeight*UP_LIFT_FACTOR;

      if(heldLongEnough && streakSustained && streakLifted){
        throwDice(1.3, vx);
        return;
      }

      // função de soltar reutilizável
      const softDrop = ()=>{
        mode = 'idle';
        heldSince = null;
        upStreakStart = null; upStreakStartDy = null;
        releasePendingSince = null;
        downSince = null;
        pendingThrow = false;
        cube.style.animation = 'idleBob 2.8s ease-in-out infinite';
        cube.style.transform = '';
        statusEl.textContent = 'Pega o dado com as duas mãos e levanta o braço';
        animateDrop();
      };

      // abaixar as mãos de forma sustentada = devolver o dado ao chão
      if(bothMovingDown){
        if(downSince===null) downSince = now;
        if(now - downSince >= DOWN_DROP_MS){ softDrop(); return; }
      } else {
        downSince = null;
      }

      // segurando tempo demais sem jogar = devolve sozinho (evita ficar "grudado" pra sempre)
      if(heldSince && (now - heldSince) > HELD_TIMEOUT_MS){ softDrop(); return; }

      const farFromDice = !hasTwo || dist(p, {x:dx,y:dy}) > camWrap.clientHeight*HOLD_RADIUS_FACTOR;
      if(farFromDice){
        // se as mãos "escaparam"/sumiram DURANTE um movimento de subida, isso É o arremesso
        // (movimento rápido borra a câmera e perde a mão — nunca deve virar soltura)
        if(heldLongEnough && (now - lastUpMotionT) < 350){
          throwDice(1.3, vx);
          return;
        }
        // soltura suave só depois de um tempo sustentado longe (debounce — sem drop instantâneo)
        if(releasePendingSince===null) releasePendingSince = now;
        if(now - releasePendingSince >= 300){
          softDrop();
        }
      } else {
        releasePendingSince = null;
      }
    }
  }

  function animateDrop(){
    diceScene.style.transition = 'left 0.4s ease, top 0.4s ease';
    setDicePos(restX, restY);
    contactShadow.style.transition = 'opacity 0.4s ease';
    contactShadow.style.opacity = 1;
    setTimeout(()=>{ diceScene.style.transition=''; dx=restX; dy=restY; }, 420);
  }

  function spawnGhost(){
    const g = cube.cloneNode(true);
    g.classList.add('ghost');
    diceScene.appendChild(g);
    setTimeout(()=>{ g.style.transition='opacity 0.3s'; g.style.opacity='0'; }, 10);
    setTimeout(()=> g.remove(), 320);
  }

  function throwDice(power, vxAtRelease){
    mode = 'thrown';
    heldSince = null;
    upStreakStart = null; upStreakStartDy = null;
    releasePendingSince = null;
    pendingThrow = false;
    statusEl.textContent = 'Lançando...';
    prizeBanner.classList.remove('show');
    cube.style.animation = 'none';
    contactShadow.style.opacity = 0;

    const result = 1+Math.floor(Math.random()*6);
    const r = ROT[result];
    const spins = 9 + Math.floor(Math.random()*3); // mais voltas pra preencher os 3~4s de giro
    // continua a partir da rotação em que o jogador deixou o dado (evita salto visual)
    const diffX = ((r.x - cubeRotX) % 360 + 360) % 360;
    const diffY = ((r.y - cubeRotY) % 360 + 360) % 360;
    const rx = cubeRotX + diffX + spins*360*(Math.random()>0.5?1:-1);
    const ry = cubeRotY + diffY + spins*360*(Math.random()>0.5?1:-1);
    const dur = 3.2 + Math.random()*0.8; // 3.2 a 4.0s
    const jumpH = camWrap.clientHeight*0.42*power;
    const sideDrift = Math.max(-80, Math.min(80, vxAtRelease*0.15));

    const startX = dx, startY = dy;
    diceScene.style.transition = `left ${dur*0.42}s cubic-bezier(.3,.6,.4,1), top ${dur*0.42}s cubic-bezier(.3,.6,.4,1)`;
    cube.style.transition = `transform ${dur}s cubic-bezier(.25,.6,.3,1)`;

    const ghostIv = setInterval(spawnGhost, 90);

    requestAnimationFrame(()=>{
      setDicePos(startX+sideDrift, Math.max(camWrap.clientHeight*0.18, startY-jumpH));
      cube.style.transform = `rotateX(${cubeRotX+(rx-cubeRotX)*0.5}deg) rotateY(${cubeRotY+(ry-cubeRotY)*0.5}deg)`;
    });

    setTimeout(()=>{
      diceScene.style.transition = `left ${dur*0.58}s cubic-bezier(.4,0,.6,1), top ${dur*0.58}s cubic-bezier(.4,0,.6,1)`;
      setDicePos(restX, restY);
      cube.style.transition = `transform ${dur*0.7}s cubic-bezier(.3,.4,.3,1)`;
      cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    }, dur*0.42*1000);

    setTimeout(()=>{
      clearInterval(ghostIv);
      clack(0.14);
      dx=restX; dy=restY;
      contactShadow.style.transition = 'opacity 0.2s ease';
      contactShadow.style.opacity = 1;
    }, dur*1000);

    setTimeout(()=> finish(result), (dur+0.35)*1000);
  }

  function finish(result){
    const prize = PRIZE_BY_FACE[result];
    prizeIcon.innerHTML = '<img src="'+prize.img+'" style="width:30vh;height:30vh;object-fit:contain;filter:drop-shadow(0 0 4vh rgba(255,215,106,0.55));" alt="">';
    prizeIcon.style.color = prize.color;
    prizeLabel.textContent = prize.label; prizeLabel.style.color = prize.color;
    prizeSub.textContent = `Face ${result}`;
    prizeBanner.classList.add('show');

    countdownFill.style.transition = 'none';
    countdownFill.style.transform = 'scaleX(1)';
    void countdownFill.offsetWidth;
    countdownFill.style.transition = 'transform 10s linear';
    countdownFill.style.transform = 'scaleX(0)';

    statusEl.textContent = `Deu face ${result}!`;
    winChime(); confetti(); startCoinRain();
    heldSince = null;

    setTimeout(()=>{
      mode = 'idle';
      cubeRotX = -15; cubeRotY = 20;
      cube.style.transition = '';
      cube.style.transform = '';
      cube.style.animation = 'idleBob 2.8s ease-in-out infinite';
      prizeBanner.classList.remove('show');
      stopCoinRain();
      statusEl.textContent = 'Agache e pegue o dado com as duas mãos';
    }, 10000);
  }

  // ---- inicialização da câmera / mediapipe ----
  // loop de renderização a 60fps: interpola suavemente até os alvos que a câmera
  // atualiza a ~15-25fps — elimina a "travadinha" da rotação/movimento
  function renderLoop(){
    if(mode==='held'){
      dx += (targetX-dx)*0.35;
      dy += (targetY-dy)*0.35;
      cubeRotX += (targetRotX-cubeRotX)*0.35;
      cubeRotY += (targetRotY-cubeRotY)*0.35;
      setDicePos(dx,dy);
      cube.style.transform = `rotateX(${cubeRotX}deg) rotateY(${cubeRotY}deg)`;
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  function startTracking(){
    computeRest();
    cameraStartTime = performance.now();
    const hands = new Hands({ locateFile: (f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
    hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async ()=> { await hands.send({image: video}); },
      width: 640, height: 480
    });
    camera.start();
  }

  permBtn.addEventListener('click', async ()=>{
    errText.textContent = '';
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width:640, height:480 }, audio:false });
      video.srcObject = stream;
      await video.play();
      permScreen.style.display = 'none';
      startTracking();
    }catch(e){
      errText.textContent = 'Não consegui acessar a câmera. Verifique permissões e se a página está em HTTPS/localhost.';
    }
  });
})();
</script>
